apply plugin: 'com.android.application'

// --- Local deployment config ------------------------------------------------
// local.properties is gitignored (see .gitignore), so the server URL and secret
// can never be committed. Keys are optional; missing keys build empty strings.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// Tolerate values pasted with surrounding quotes.
def unquote = { value -> (value ?: '').replaceAll(/^["']|["']$/, '') }
def localServerUrl = unquote(localProps.getProperty('DEFAULT_SERVER_URL'))
def localServerSecret = unquote(localProps.getProperty('DEFAULT_SECRET'))
// Text-room PIN baked in at build time (see DEFAULT_ROOM_PIN in local.properties).
// KNOWN WEAK: a static PIN shared by every build is not a real secret. It is a
// stop-gap until per-device credentials land in Phase 5.
def localRoomPin = unquote(localProps.getProperty('DEFAULT_ROOM_PIN'))

android {
    namespace 'com.hmdm.control'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hmdm.control"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 16
        versionName "1.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Server URL and secret are deployment-specific and must never enter git.
        // They are read from local.properties (gitignored); see README section
        // "Supplying the server URL and secret". Both are empty when unset.
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${localServerUrl}\""
        buildConfigField "String", "DEFAULT_SECRET", "\"${localServerSecret}\""
        buildConfigField "String", "DEFAULT_ROOM_PIN", "\"${localRoomPin}\""

        // Build variant displayed on the "About" screen
        buildConfigField("String", "VARIANT", "\"opensource\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // AGP 8 disables buildConfig by default; this project relies on it.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.3.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.8.0'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-core:2.9.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.9.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.4'

    // WebRTC: upstream used the floating 'org.webrtc:google-webrtc:1.0.+' from the
    // now-dead jcenter. This is the maintained Maven Central successor; it ships the
    // same org.webrtc.* API (verified: PeerConnection/PeerConnectionFactory/DataChannel
    // present in classes.jar of 1.3.8). Pinned for reproducible builds.
    implementation 'io.getstream:stream-webrtc-android:1.3.8'

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
}
